# FileExplorer JUL configuration
# This file is read via: -Djava.util.logging.config.file=./config/logging.properties

handlers= java.util.logging.ConsoleHandler
.level= WARNING

# IMPORTANT: keep handler at ALL so per-class logger levels can be raised without editing handler config.
java.util.logging.ConsoleHandler.level= ALL
java.util.logging.ConsoleHandler.formatter= java.util.logging.SimpleFormatter

# ISO-like timestamp, level, logger, and message.
java.util.logging.SimpleFormatter.format=%1$tF %1$tT.%1$tL %4$-7s %2$s - %5$s%6$s%n

# Example per-class overrides (scripts will manage these):
com.fileexplorer.MainApp.level = FINER
com.fileexplorer.ui.MainController.level = FINER
com.fileexplorer.MainApp.level = FINER
com.fileexplorer.ui.BreadcrumbBar.level = FINER
com.fileexplorer.ui.BreadcrumbBarController.level = FINER
com.fileexplorer.ui.BreadcrumbController.level = FINER
com.fileexplorer.ui.ClipboardUtil.level = FINER
com.fileexplorer.ui.FileSizeFormatter.level = FINER
com.fileexplorer.ui.IconLoader.level = FINER
com.fileexplorer.ui.LayoutGrowUtil.level = FINER
com.fileexplorer.ui.MainController.level = FINER
com.fileexplorer.ui.UiZoomManager.level = FINER
com.fileexplorer.ui.ZoomRoot.level = FINER
com.fileexplorer.ui.service.FileMetadataService.level = FINER
com.fileexplorer.ui.service.IconCacheService.level = FINER
com.fileexplorer.ui.service.ThemeService.level = FINER
com.fileexplorer.ui.service.TreeBuildService.level = FINER
com.fileexplorer.util.ResourceAudit.level = FINER


# HOTFIX178 JUL routing / capability probes
com.fileexplorer.util.StartupTrace.level = INFO
com.fileexplorer.app.MainApp.level = INFO
com.fileexplorer.service.icon.AsyncThumbnailService.level = INFO
com.fileexplorer.tools.RegressionCheckMain.level = INFO
com.fileexplorer.controller.breadcrumb.BreadcrumbBarController.level = INFO
com.fileexplorer.ui.breadcrumb.BreadcrumbBar.level = INFO

# HOTFIX179 PDF thumbnail noise suppression / external library routing
co.elastic.thumbnails4j.pdf.PDFThumbnailer.level = WARNING
org.apache.pdfbox.level = WARNING

# HOTFIX180 PDF interrupt/cancellation noise collapse
org.apache.pdfbox.cos.COSObject.level = OFF
org.apache.pdfbox.contentstream.PDFStreamEngine.level = OFF
org.apache.pdfbox.rendering.PageDrawer.level = OFF
org.apache.pdfbox.pdfparser.COSParser.level = OFF
